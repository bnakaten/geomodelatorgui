config:
  base: static/tmp/
  compress: true
  csv:
    columns:
    - x
    - y
    - z
    compress: true
    delimiter: ' '
    header: 1
  file: configuration.json
  inputPath: ''
  modelFileVtk: model.vts
  outputPath: ''
  shapePath: ''
globals:
  defaultPath: ../static/demo/
  uploadPath: ../static/tmp/
gui:
  partitionColor:
    color:
    - '#ffffff'
    - '#1f77b4'
    - '#aec7e8'
    - '#ff7f0e'
    - '#ffbb78'
    partition:
    - all
    - default
    - surface-1
    - surface-2
    - surface-3
    show:
    - false
    - true
    - true
    - true
    - true
  surfaceColor:
    color:
    - '#8c564b'
    - '#c49c94'
    - '#e377c2'
    show:
    - true
    - true
    - true
    surface:
    - surface-1
    - surface-2
    - surface-3
model:
  3d: true
  cellNumberX: 150
  cellNumberY: 50
  cellNumberZ: 80
  cornerPoint1:
  - 0
  - 0
  - 0
  cornerPoint2:
  - 150
  - 0
  - 0
  dimension:
  - 150
  - 50
  - 80
  discretisationType: n
  partitionId:
    all: 0
    default: 1
    surface-1: 2
    surface-2: 3
    surface-3: 4
  structureRank:
    surface-1: 3
    surface-2: 2
    surface-3: 1
  structureWidth: {}
run: false
structure:
  extension:
  - .csv
  - .csv
  - .csv
  file:
  - surface-1.csv
  - surface-2.csv
  - surface-3.csv
  type:
  - layer
  - layer
  - layer
